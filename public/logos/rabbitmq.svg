<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- RabbitMQ logo simplified -->
  <rect width="100" height="100" rx="12" fill="#FF6600"/>
  <!-- Rabbit head body -->
  <rect x="28" y="38" width="44" height="38" rx="6" fill="white"/>
  <!-- Left ear -->
  <rect x="30" y="14" width="14" height="28" rx="7" fill="white"/>
  <!-- Right ear -->
  <rect x="56" y="14" width="14" height="28" rx="7" fill="white"/>
  <!-- Inner left ear -->
  <rect x="34" y="17" width="6" height="20" rx="3" fill="#FF6600"/>
  <!-- Inner right ear -->
  <rect x="60" y="17" width="6" height="20" rx="3" fill="#FF6600"/>
  <!-- Eye left -->
  <circle cx="40" cy="52" r="4" fill="#FF6600"/>
  <!-- Eye right -->
  <circle cx="60" cy="52" r="4" fill="#FF6600"/>
  <!-- Nose -->
  <circle cx="50" cy="62" r="3" fill="#FF6600"/>
</svg>
